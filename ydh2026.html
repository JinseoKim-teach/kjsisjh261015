<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연등회 밤하늘 (교사용)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- 한글 명조/전통 웹폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/MaruBuri.woff" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMeRoGyq8L36-KwbsvkusBJjQ1MPkuQfs",
      authDomain: "kjsisjh260515.firebaseapp.com",
      projectId: "kjsisjh260515",
      storageBucket: "kjsisjh260515.firebasestorage.app",
      messagingSenderId: "899082747836",
      appId: "1:899082747836:web:e4cd38e7877967c83cf5b9",
      measurementId: "G-95D44QD7KK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const wishesCol = collection(db, "wishes");

    window.db = db;
    window.wishesCol = wishesCol;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.getDocs = getDocs;

    const q = query(wishesCol, orderBy("createdAt", "asc"));
    const renderedIds = new Set();

    onSnapshot(q, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          const data = { id: change.doc.id, ...change.doc.data() };
          if (!renderedIds.has(data.id)) {
            renderedIds.add(data.id);
            window.addLanternToSky(data);
          }
        } else if (change.type === "removed") {
          renderedIds.delete(change.doc.id);
          const el = document.getElementById(`lantern-${change.doc.id}`);
          if (el) el.remove();
          window.updateCounter();
        }
      });
    });
  </script>

  <style>
    @font-face {
      font-family: 'MaruBuri';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/MaruBuri-Bold.woff') format('woff');
      font-weight: 700;
    }
    body {
      font-family: 'MaruBuri', 'Noto Serif KR', serif;
      background: radial-gradient(ellipse at bottom, #0f172a 0%, #030712 100%);
      min-height: 100vh;
      color: #f3f4f6;
      overflow: hidden;
      user-select: none;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
    @keyframes floatUp {
      0% {
        transform: translate(-50%, 115vh) scale(0.92);
        opacity: 0;
      }
      8% { opacity: 0.98; }
      88% { opacity: 0.98; }
      100% {
        transform: translate(-50%, -35vh) scale(1.08);
        opacity: 0;
      }
    }
    /* translate(-50%)를 애니메이션 키프레임에 직접 포함해 완벽한 중앙 정렬 유지 */
    .floating-lantern {
      position: absolute;
      animation: floatUp 34s linear infinite;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* 30pt 글씨를 넉넉하게 담는 소원지 카드 */
    .wish-tag {
      background: rgba(15, 23, 42, 0.93);
      border: 2px solid rgba(251, 191, 36, 0.65);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      width: 420px;
      max-width: 90vw;
    }
  </style>
</head>
<body class="relative w-screen h-screen">

  <div id="stars-container" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- 상단 제어 바 -->
  <div class="absolute top-4 left-4 z-30 flex items-center gap-3 bg-gray-900/85 backdrop-blur-md px-5 py-3 rounded-2xl border border-gray-700/60 text-sm">
    <div class="flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-gray-300">날아오른 연등: <b id="lantern-count" class="text-amber-400 font-mono text-base">0</b>개</span>
    </div>
    <div class="h-4 w-px bg-gray-700"></div>
    <button onclick="clearAllLanterns()" class="text-gray-400 hover:text-red-400 transition flex items-center gap-1.5 cursor-pointer">
      <i data-lucide="trash-2" class="w-4 h-4"></i> 비우기
    </button>
    <button onclick="toggleFullscreen()" class="text-gray-400 hover:text-amber-300 transition flex items-center gap-1.5 cursor-pointer">
      <i data-lucide="maximize" class="w-4 h-4"></i> 전체화면
    </button>
  </div>

  <!-- 하늘 캔버스 -->
  <div id="sky-canvas" class="relative w-full h-full overflow-hidden">
    <div id="empty-notice" class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
      <div class="text-7xl mb-4 animate-bounce">🏮</div>
      <p class="text-3xl sm:text-4xl text-amber-200 font-bold tracking-wide">학생들의 소원을 기다리고 있습니다</p>
      <p class="text-base text-gray-400 mt-3 font-sans">학생이 소원을 띄우면 큼직한 연등과 소원지가 함께 피어오릅니다.</p>
    </div>
  </div>

  <script>
    // 별 생성
    const stars = document.getElementById('stars-container');
    for (let i = 0; i < 75; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.width = `${Math.random() * 2.5 + 1}px`;
      s.style.height = s.style.width;
      s.style.left = `${Math.random() * 100}%`;
      s.style.top = `${Math.random() * 100}%`;
      s.style.animationDelay = `${Math.random() * 3}s`;
      stars.appendChild(s);
    }

    // 연등 생성 (중앙 정렬 + 30pt 수준의 큰 글씨)
    window.addLanternToSky = function(data) {
      const sky = document.getElementById('sky-canvas');
      const el = document.createElement('div');
      el.id = `lantern-${data.id}`;
      el.className = 'floating-lantern';
      
      // 좌우 여백 확보 (소원지가 넓어졌으므로 12% ~ 88% 사이 배치)
      const left = Math.random() * 70 + 15;
      const duration = Math.random() * 10 + 30; // 30초~40초 동안 천천히 상승
      el.style.left = `${left}%`;
      el.style.animationDuration = `${duration}s`;

      el.innerHTML = `
        <div class="flex flex-col items-center w-full">
          <!-- 연등 본체 -->
          <svg width="115" height="130" viewBox="0 0 100 120" style="filter: drop-shadow(0 0 26px ${data.glow});" class="shrink-0">
            <ellipse cx="50" cy="18" rx="25" ry="9" fill="#d97706" />
            <path d="M 26 20 C 6 52, 6 78, 26 100 C 38 107, 62 107, 74 100 C 94 78, 94 52, 74 20 Z" fill="${data.color}" opacity="0.95" />
            <ellipse cx="50" cy="98" rx="25" ry="8" fill="#b45309" />
            <circle cx="50" cy="60" r="19" fill="#fffbeb" opacity="0.88" style="filter: blur(5px);" />
            <line x1="50" y1="104" x2="50" y2="120" stroke="#f59e0b" stroke-width="3.5" />
          </svg>

          <!-- 소원지 (완전 중앙 정렬 + 약 30pt/40px 글씨 크기) -->
          <div class="wish-tag mt-2 px-5 py-4 rounded-3xl text-center">
            <!-- 작성자 & 분야 -->
            <div class="text-[20px] font-sans text-amber-300 font-bold mb-2 flex items-center justify-center gap-2">
              <span class="px-2.5 py-0.5 rounded-full bg-amber-400/20 border border-amber-400/40 text-[18px]">[${data.category}]</span>
              <span class="text-gray-100">${data.author}</span>
            </div>
            <!-- 소원 내용: 약 30pt (38px) 적용 -->
            <div class="text-[38px] text-amber-50 font-bold leading-[1.35] tracking-tight whitespace-pre-wrap break-keep px-1">
              "${data.text}"
            </div>
          </div>
        </div>
      `;

      sky.appendChild(el);
      window.updateCounter();
    };

    window.updateCounter = function() {
      const count = document.querySelectorAll('.floating-lantern').length;
      document.getElementById('lantern-count').innerText = count;
      document.getElementById('empty-notice').style.display = count > 0 ? 'none' : 'flex';
    };

    async function clearAllLanterns() {
      if (!confirm('모든 연등을 비우시겠습니까?')) return;
      const snap = await window.getDocs(window.wishesCol);
      await Promise.all(snap.docs.map(d => window.deleteDoc(window.doc(window.db, "wishes", d.id))));
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    lucide.createIcons();
  </script>
</body>
</html>
